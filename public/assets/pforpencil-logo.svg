<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#151b42" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#151b42" flood-opacity="0.15" />
    </filter>
    
    <filter id="text3D" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <filter id="dropletShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f1738" flood-opacity="0.18" />
    </filter>

    <!-- Purple Block Gradient -->
    <linearGradient id="purpleGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9d3aff" />
      <stop offset="40%" stop-color="#7d1ff0" />
      <stop offset="100%" stop-color="#550fbe" />
    </linearGradient>

    <!-- Pink Block Gradient -->
    <linearGradient id="pinkGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="45%" stop-color="#f2117d" />
      <stop offset="100%" stop-color="#c7005f" />
    </linearGradient>

    <!-- Turquoise Block Gradient -->
    <linearGradient id="tealGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#00dede" />
      <stop offset="40%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#008ba3" />
    </linearGradient>

    <!-- Droplet Pink -->
    <linearGradient id="dropPink" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ff3b9d" />
      <stop offset="100%" stop-color="#e6006e" />
    </linearGradient>

    <!-- Droplet Yellow -->
    <linearGradient id="dropYellow" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffbf00" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Droplet Blue -->
    <linearGradient id="dropBlue" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#14adff" />
      <stop offset="100%" stop-color="#0072f5" />
    </linearGradient>

    <!-- White Gloss Gradient -->
    <linearGradient id="whiteGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Letter Fill -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f5" />
    </linearGradient>
  </defs>

  <!-- Group with Drop Shadow for 3D toys -->
  <g filter="url(#softShadow)">
    <!-- 1. THREE TOP DROPLETS / SPLASHES -->
    <!-- Droplet Left (Pink) -->
    <g transform="translate(520, 115) rotate(-35)" filter="url(#dropletShadow)">
      <path d="M 0,-42 C 16,-42 26,-15 26,12 C 26,30 14,44 0,44 C -14,44 -26,30 -26,12 C -26,-15 -16,-42 0,-42 Z" fill="url(#dropPink)" />
      <!-- Specular Highlight -->
      <ellipse cx="-7" cy="2" rx="5" ry="18" fill="#ffffff" opacity="0.65" transform="rotate(-10)" />
      <circle cx="-5" cy="-22" r="3.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Droplet Center (Golden Yellow) -->
    <g transform="translate(625, 75)" filter="url(#dropletShadow)">
      <path d="M 0,-56 C 22,-56 32,-18 32,18 C 32,40 18,58 0,58 C -18,58 -32,40 -32,18 C -32,-18 -22,-56 0,-56 Z" fill="url(#dropYellow)" />
      <!-- Specular Highlight -->
      <ellipse cx="-9" cy="5" rx="6" ry="24" fill="#ffffff" opacity="0.7" />
      <circle cx="-7" cy="-30" r="4.5" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Droplet Right (Sky Blue) -->
    <g transform="translate(720, 110) rotate(35)" filter="url(#dropletShadow)">
      <path d="M 0,-42 C 16,-42 26,-15 26,12 C 26,30 14,44 0,44 C -14,44 -26,30 -26,12 C -26,-15 -16,-42 0,-42 Z" fill="url(#dropBlue)" />
      <!-- Specular Highlight -->
      <ellipse cx="-7" cy="2" rx="5" ry="18" fill="#ffffff" opacity="0.65" transform="rotate(-10)" />
      <circle cx="-5" cy="-22" r="3.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- 2. PURPLE BLOCK "P" (Tilted ~ -6deg) -->
    <g transform="translate(180, 310) rotate(-6)">
      <!-- Main rounded cube -->
      <rect x="-140" y="-140" width="280" height="280" rx="68" fill="url(#purpleGrad)" />
      <!-- Top inner edge highlight -->
      <path d="M -110,-132 Q 0,-140 110,-132 Q 132,-110 132,-70 Q 70,-115 -110,-115 Z" fill="url(#whiteGloss)" opacity="0.45" />
      <!-- Left side specular glint -->
      <path d="M -128,-90 C -136,-40 -136,40 -124,90 C -116,90 -120,-40 -115,-90 Z" fill="#ffffff" opacity="0.25" />
      
      <!-- Letter "P" bold 3D rounded -->
      <g filter="url(#text3D)">
        <!-- 3D P Shape with rounded geometry -->
        <path d="M -65,95 L -65,-75 C -65,-92 -45,-102 -20,-102 L 18,-102 C 62,-102 96,-74 96,-25 C 96,24 62,52 18,52 L -18,52 L -18,95 C -18,104 -28,110 -40,110 C -55,110 -65,104 -65,95 Z M -18,10 L 12,10 C 35,10 50,-5 50,-25 C 50,-45 35,-60 12,-60 L -18,-60 Z" fill="url(#letterGrad)" />
        <!-- Inner shadow / bevel on P -->
        <path d="M -60,95 L -60,-70 C -60,-85 -42,-95 -20,-95 L 18,-95 C 55,-95 88,-70 88,-25 C 88,18 55,45 18,45 L -18,45" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9" />
      </g>
    </g>

    <!-- 3. PINK BLOCK "for" -->
    <g transform="translate(415, 312)">
      <!-- Rounded square block -->
      <rect x="-105" y="-105" width="210" height="210" rx="55" fill="url(#pinkGrad)" />
      <!-- Top inner edge highlight -->
      <path d="M -85,-98 Q 0,-105 85,-98 Q 98,-85 98,-50 Q 50,-85 -85,-85 Z" fill="url(#whiteGloss)" opacity="0.4" />
      <path d="M -98,-65 C -103,-25 -103,25 -95,65 C -90,65 -93,-25 -88,-65 Z" fill="#ffffff" opacity="0.2" />

      <!-- Word "for" chunky rounded lowercase -->
      <g filter="url(#text3D)">
        <text x="0" y="32" font-family="'Nunito', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="118" font-weight="900" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-3">for</text>
      </g>
    </g>

    <!-- 4. TURQUOISE BLOCK "Pencil" -->
    <g transform="translate(735, 308)">
      <!-- Rounded pill rectangle -->
      <rect x="-225" y="-120" width="450" height="240" rx="60" fill="url(#tealGrad)" />
      <!-- Top inner edge highlight -->
      <path d="M -200,-112 Q 0,-122 200,-112 Q 220,-95 220,-60 Q 150,-98 -200,-98 Z" fill="url(#whiteGloss)" opacity="0.45" />
      <path d="M -218,-70 C -224,-20 -224,20 -214,70 C -208,70 -212,-20 -207,-70 Z" fill="#ffffff" opacity="0.25" />

      <!-- Word "Pencil" chunky rounded Titlecase -->
      <g filter="url(#text3D)">
        <text x="0" y="38" font-family="'Nunito', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="138" font-weight="900" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-2">Pencil</text>
      </g>
    </g>
  </g>
</svg>
