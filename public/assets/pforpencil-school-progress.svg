<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Blue Circular School Badge at top right -->
  <g transform="translate(245, 10)" filter="url(#cardShadow)">
    <circle cx="28" cy="28" r="24" fill="#e0f2fe" />
    <!-- Schoolhouse icon -->
    <path d="M 16,38 L 16,26 L 28,18 L 40,26 L 40,38 Z" fill="#0284c7" />
    <polygon points="13,26 28,15 43,26" fill="#0369a1" />
    <!-- Flag -->
    <line x1="28" y1="15" x2="28" y2="8" stroke="#0284c7" stroke-width="2" />
    <polygon points="28,8 36,11 28,14" fill="#f43f5e" />
    <!-- Pillars / Door -->
    <rect x="25" y="30" width="6" height="8" rx="1" fill="#ffffff" />
    <circle cx="21" cy="27" r="1.5" fill="#ffffff" />
    <circle cx="35" cy="27" r="1.5" fill="#ffffff" />
  </g>

  <!-- Class Progress Card (in center) -->
  <g transform="translate(10, 30)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="16" y="24" font-family="sans-serif" font-weight="800" font-size="12" fill="#0f172a">Class Progress</text>

    <!-- Grade 3 - 87% (Green) -->
    <g transform="translate(16, 42)">
      <text x="0" y="10" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Grade 3</text>
      <text x="50" y="10" font-family="sans-serif" font-weight="900" font-size="10" fill="#0f172a">87%</text>
      <!-- Track -->
      <rect x="78" y="2" width="105" height="10" rx="5" fill="#e2e8f0" />
      <rect x="78" y="2" width="91" height="10" rx="5" fill="#10b981" />
    </g>

    <!-- Grade 4 - 78% (Blue) -->
    <g transform="translate(16, 68)">
      <text x="0" y="10" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Grade 4</text>
      <text x="50" y="10" font-family="sans-serif" font-weight="900" font-size="10" fill="#0f172a">78%</text>
      <!-- Track -->
      <rect x="78" y="2" width="105" height="10" rx="5" fill="#e2e8f0" />
      <rect x="78" y="2" width="82" height="10" rx="5" fill="#0ea5e9" />
    </g>

    <!-- Grade 5 - 82% (Purple) -->
    <g transform="translate(16, 94)">
      <text x="0" y="10" font-family="sans-serif" font-weight="700" font-size="10" fill="#64748b">Grade 5</text>
      <text x="50" y="10" font-family="sans-serif" font-weight="900" font-size="10" fill="#0f172a">82%</text>
      <!-- Track -->
      <rect x="78" y="2" width="105" height="10" rx="5" fill="#e2e8f0" />
      <rect x="78" y="2" width="86" height="10" rx="5" fill="#8b5cf6" />
    </g>
  </g>

  <!-- Books and Small Desk Plant at bottom right -->
  <g transform="translate(225, 125)">
    <!-- Book stack -->
    <rect x="0" y="22" width="65" height="10" rx="2" fill="#38bdf8" />
    <rect x="5" y="14" width="55" height="9" rx="2" fill="#fbbf24" />
    <rect x="10" y="6" width="48" height="9" rx="2" fill="#0284c7" />

    <!-- Mini Plant Pot -->
    <g transform="translate(70, 0)">
      <polygon points="5,32 18,32 16,18 7,18" fill="#d97706" />
      <!-- Green Leaves -->
      <path d="M 11.5,18 Q 6,6 1,12 Q 7,14 11.5,18 Z" fill="#10b981" />
      <path d="M 11.5,18 Q 16,4 21,9 Q 16,13 11.5,18 Z" fill="#059669" />
      <path d="M 11.5,18 Q 12,2 15,2 Q 13,11 11.5,18 Z" fill="#34d399" />
    </g>
  </g>
</svg>
