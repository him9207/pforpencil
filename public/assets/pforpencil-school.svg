<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <defs>
    <filter id="schoolShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1689ef" flood-opacity="0.18" />
    </filter>
    <linearGradient id="schoolWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#c9180e" />
    </linearGradient>
  </defs>

  <g filter="url(#schoolShadow)">
    <!-- Trees on flanks -->
    <circle cx="45" cy="190" r="32" fill="#10b981" />
    <circle cx="45" cy="180" r="26" fill="#34d399" />
    <rect x="40" y="205" width="10" height="35" rx="3" fill="#78350f" />

    <circle cx="275" cy="190" r="32" fill="#10b981" />
    <circle cx="275" cy="180" r="26" fill="#34d399" />
    <rect x="270" y="205" width="10" height="35" rx="3" fill="#78350f" />

    <!-- Main Schoolhouse Building -->
    <rect x="75" y="115" width="170" height="125" rx="8" fill="url(#schoolWall)" stroke="#7dd3fc" stroke-width="3" />

    <!-- Pitched Roof -->
    <polygon points="60,118 160,50 260,118" fill="url(#roofGrad)" />
    <polygon points="75,115 160,56 245,115" fill="#f87171" opacity="0.4" />

    <!-- Clock / Bell Tower -->
    <rect x="135" y="28" width="50" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    <circle cx="160" cy="45" r="11" fill="#0284c7" />
    <line x1="160" y1="45" x2="160" y2="39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="160" y1="45" x2="165" y2="45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tower Roof & Flag -->
    <polygon points="130,28 160,10 190,28" fill="url(#roofGrad)" />
    <line x1="160" y1="10" x2="160" y2="0" stroke="#64748b" stroke-width="2" />
    <polygon points="160,0 178,6 160,12" fill="#1689ef" />

    <!-- School Banner Sign -->
    <rect x="115" y="110" width="90" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="160" y="124" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#1e293b" text-anchor="middle">SCHOOL</text>

    <!-- Classroom Windows with Cross Bars -->
    <rect x="95" y="145" width="26" height="34" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <line x1="108" y1="145" x2="108" y2="179" stroke="#bae6fd" stroke-width="2" />
    <line x1="95" y1="162" x2="121" y2="162" stroke="#bae6fd" stroke-width="2" />

    <rect x="199" y="145" width="26" height="34" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <line x1="212" y1="145" x2="212" y2="179" stroke="#bae6fd" stroke-width="2" />
    <line x1="199" y1="162" x2="225" y2="162" stroke="#bae6fd" stroke-width="2" />

    <!-- Double Red Entrance Door -->
    <path d="M 142,240 L 142,190 C 142,185 146,180 151,180 L 169,180 C 174,180 178,185 178,190 L 178,240 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
    <line x1="160" y1="180" x2="160" y2="240" stroke="#b91c1c" stroke-width="2" />
    <circle cx="155" cy="212" r="2.5" fill="#fef08a" />
    <circle cx="165" cy="212" r="2.5" fill="#fef08a" />
  </g>
</svg>
